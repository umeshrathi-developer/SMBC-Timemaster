{% extends 'base.html' %}
{% load static %}

{% block title %}Login - Timesheet Comp-Off & Management{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-lg">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <img src="{% static 'Logo3.png' %}" alt="TimeMaster Logo" style="max-height: 72px; width: auto;" class="mb-3">
                    <h2 class="card-title">Timesheet & Comp-Off</h2>
                    <p class="text-muted">Employee Time Management System</p>
                </div>

                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 mb-3">
                        <i class="bi bi-box-arrow-in-right"></i> Login
                    </button>
                </form>

                <hr>

                <p class="text-center mb-0">
                    Don't have an account? 
                    <a href="/timesheet/register/" class="text-decoration-none">Create one here</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

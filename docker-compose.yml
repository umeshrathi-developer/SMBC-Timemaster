services:
  timemaster:
    build: .
    image: timemaster:latest
    container_name: timemaster
    restart: unless-stopped
    ports:
      - "${TIMEMASTER_HOST_PORT:-8000}:8000"
    environment:
      DEBUG: "${DEBUG:-False}"
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY in .env before starting the container}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost 127.0.0.1}"
      CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:-http://localhost:8000}"
      TIME_ZONE: "${TIME_ZONE:-UTC}"
      EMAIL_HOST: "${EMAIL_HOST:-smtp.gmail.com}"
      EMAIL_PORT: "${EMAIL_PORT:-587}"
      EMAIL_USE_TLS: "${EMAIL_USE_TLS:-True}"
      EMAIL_HOST_USER: "${EMAIL_HOST_USER:-}"
      EMAIL_HOST_PASSWORD: "${EMAIL_HOST_PASSWORD:-}"
      DEFAULT_FROM_EMAIL: "${DEFAULT_FROM_EMAIL:-}"
      ACCRUAL_SUMMARY_TO_EMAILS: "${ACCRUAL_SUMMARY_TO_EMAILS:-}"
      ACCRUAL_SUMMARY_CC_EMAILS: "${ACCRUAL_SUMMARY_CC_EMAILS:-}"
      SERVE_MEDIA: "${SERVE_MEDIA:-True}"
      DATA_DIR: /app/data
      LOG_DIR: /app/logs
      MEDIA_ROOT: /app/media
    volumes:
      - timemaster_data:/app/data
      - timemaster_media:/app/media
      - timemaster_logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/login/', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  timemaster_data:
  timemaster_media:
  timemaster_logs:
